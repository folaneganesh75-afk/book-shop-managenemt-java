server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bookshop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bookpass}
spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=health,info